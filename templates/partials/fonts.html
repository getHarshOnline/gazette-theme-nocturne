<style>
{% for resource in presentation.theme_resources %}
{% if resource.id == "font:reading" %}
@font-face { font-family: 'Instrument Sans'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('{{ resource.url | replace(from="'", to="%27") | replace(from="\\", to="%5C") | replace(from="<", to="%3C") | replace(from=">", to="%3E") | replace(from="\n", to="%0A") | replace(from="\r", to="%0D") | safe }}') format('woff2'); }
{% elif resource.id == "font:reading-italic" %}
@font-face { font-family: 'Instrument Sans'; font-style: italic; font-weight: 400 700; font-display: swap; src: url('{{ resource.url | replace(from="'", to="%27") | replace(from="\\", to="%5C") | replace(from="<", to="%3C") | replace(from=">", to="%3E") | replace(from="\n", to="%0A") | replace(from="\r", to="%0D") | safe }}') format('woff2'); }
{% elif resource.id == "font:system" %}
@font-face { font-family: 'Martian Mono'; font-style: normal; font-weight: 100 800; font-stretch: 75% 112.5%; font-display: swap; src: url('{{ resource.url | replace(from="'", to="%27") | replace(from="\\", to="%5C") | replace(from="<", to="%3C") | replace(from=">", to="%3E") | replace(from="\n", to="%0A") | replace(from="\r", to="%0D") | safe }}') format('woff2'); }
{% elif resource.id == "font:display" %}
@font-face { font-family: 'Anybody'; font-style: normal; font-weight: 100 900; font-stretch: 50% 150%; font-display: swap; src: url('{{ resource.url | replace(from="'", to="%27") | replace(from="\\", to="%5C") | replace(from="<", to="%3C") | replace(from=">", to="%3E") | replace(from="\n", to="%0A") | replace(from="\r", to="%0D") | safe }}') format('woff2'); }
{% endif %}
{% endfor %}
</style>
